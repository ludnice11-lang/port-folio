# ===== ROBÔ Q PUBLICA O PORTFÓLIO NO GITHUB PAGES =====
# Este ficheiro é lido pelo GitHub (ñ pelo meu PC).
# Linhas q começam c/ # são comentários: o GitHub ignora-as.
# ATENÇÃO: em YAML os espaços no início das linhas são importantes. Ñ os apagues!

# Nome do robô (aparece no separador "Actions" do GitHub)
name: Publicar no GitHub Pages

# QD o robô trabalha:
on:
  push:
    branches: [main] # sempre q eu fizer push p/ o ramo "main"
  workflow_dispatch: # e tb qd eu carregar num btn no separador "Actions"

# Autorizações q o robô precisa p/ publicar o st
permissions:
  contents: read # ler o código
  pages: write # escrever no GitHub Pages
  id-token: write # provar ao Pages q é msm o meu robô

# Se eu fizer 2 pushes seguidos, ñ publica os 2 ao msm tempo
concurrency:
  group: pages
  cancel-in-progress: false

# O Q o robô faz: 2 tarefas, 1 depois da outra
jobs:
  # ----- Tarefa 1: traduzir o projeto Angular -----
  construir:
    runs-on: ubuntu-latest # usa 1 PC do GitHub (c/ Linux)
    steps:
      # Passo 1: copiar o meu código p/ o PC do GitHub
      - uses: actions/checkout@v5

      # Passo 2: instalar o Node (a msm versão 24 q tenho no meu PC)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm # guarda os pacotes p/ a próxima vez ser + rápida

      # Passo 3: instalar os pacotes do projeto (como a pasta node_modules)
      - run: npm ci

      # Passo 4: perguntar ao GitHub Pages qual é o endereço do st
      # (ex.: /port-folio). O "id: pages" dá 1 nome a este passo p/ usar a resposta depois.
      - id: pages
        uses: actions/configure-pages@v5

      # Passo 5: traduzir o Angular p/ HTML, CSS e JavaScript normais.
      # O --base-href diz ao st em q "pasta" do endereço ele mora.
      # Usa a resposta do passo anterior, logo ñ preciso de escrever o nome à mão.
      - run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # Passo 6: embrulhar a pasta traduzida p/ entregar ao Pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/portefolio/browser

  # ----- Tarefa 2: pôr o st no ar -----
  publicar:
    needs: construir # só começa qd a tarefa 1 acabar bem
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # o endereço do st
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
